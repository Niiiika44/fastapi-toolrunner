name: autorunning-prod
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
services:
  app:
    image: "ghcr.io/niiiika44/autorunning:${IMAGE_TAG}"
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: "ghcr.io/niiiika44/autorunning:${IMAGE_TAG}"
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2 -E

  migrate:
    image: "ghcr.io/niiiika44/autorunning:${IMAGE_TAG}"
    restart: "no"
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
      FLOWER_BASIC_AUTH: ${FLOWER_USER}:${FLOWER_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy

  beat:
    image: "ghcr.io/niiiika44/autorunning:${IMAGE_TAG}"
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    command: >
      celery -A app.core.celery_app beat --loglevel=info
      --schedule=/tmp/celerybeat-schedule --pidfile=

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbucket:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      echo bucket ready
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_started
    networks:
      default:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Host: fannyaround4.fun' http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM;
            while :; do certbot renew --webroot -w /var/www/certbot;
            sleep 12h & wait $${!}; done'


volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  certs:
  certbot_webroot:
