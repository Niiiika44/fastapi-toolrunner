worker_processes auto;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile      on;
    tcp_nopush    on;

    server_tokens off;

    log_format main '$remote_addr - $status "$request" '
                    'bytes=$body_bytes_sent '
                    'request_time=$request_time upstream_time=$upstream_response_time '
                    'ua="$http_user_agent"';

    access_log /dev/stdout main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;

    limit_req_status 429;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name fannyaround4.fun www.fannyaround4.fun;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        server_name www.fannyaround4.fun;

        ssl_certificate /etc/letsencrypt/live/fannyaround4.fun/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fannyaround4.fun/privkey.pem;

        add_header Strict-Transport-Security "max-age=300" always;

        return 301 https://fannyaround4.fun$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name fannyaround4.fun;

        ssl_certificate /etc/letsencrypt/live/fannyaround4.fun/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fannyaround4.fun/privkey.pem;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=300" always;

        client_max_body_size 10m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        set $app_upstream "http://app:8000";

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass $app_upstream;
        }

        location = /api/auth/register {
            limit_req zone=register burst=3 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass $app_upstream;
        }

        # Websocket
        location ~ ^/api/tests/\d+/status$ {
            include /etc/nginx/proxy_params.conf;
            proxy_pass $app_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300s;
        }

        location /api/ {
            include /etc/nginx/proxy_params.conf;
            proxy_pass $app_upstream;
        }
    }
}
